# Builds installers for Windows, macOS and Linux. Desktop apps must be compiled
# on each OS they target, so this runs the same build on three machines.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Creates the draft release and uploads installers to it.
permissions:
  contents: write

jobs:
  # Fast checks first: a tag with mismatched versions or uncommitted files
  # fails here, before three long builds.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versions match the tag, every module is committed
        run: python scripts/check-release.py ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      # The engine's own packages, pinned as friends get them (the chunking tests
      # use faster-whisper's speech detector). No models are downloaded.
      - name: Engine tests
        working-directory: engine
        run: |
          python -m pip install -r requirements.txt -c constraints.txt
          python test_commands.py
          python test_speakers.py
          python test_mixed.py

  rust-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The Tauri crate embeds the built frontend (dist/), so build it first.
      - run: npm ci
      - run: npm run build

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  build:
    needs: [checks, rust-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest # one app for Apple Silicon and Intel Macs
            args: "--target universal-apple-darwin"
          - os: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libpipewire-0.3-dev libclang-dev libxdo-dev libdbus-1-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs updates so installed copies accept them (see README -> Releases).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Voice Desk ${{ github.ref_name }}
          releaseBody: "Download the installer for your computer below. Voice Desk downloads the rest on first start (about 1-4 GB, depending on the computer)."
          releaseDraft: true
          # latest.json: installed copies find updates here.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Manual runs make no release: keep the installers as downloadable artifacts.
      - name: Upload installers
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: voice-desk-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/
          if-no-files-found: error
