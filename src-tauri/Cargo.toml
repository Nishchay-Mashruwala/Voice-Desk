[package]
name = "voicedesk"
version = "0.2.1"
description = "Local voice dictation and meeting task extraction"
authors = ["Rajvee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voicedesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
hound = "3.5.1"
anyhow = "1.0.104"
arboard = "3.6.1"
enigo = "0.6.1"
chrono = "0.4.45"
tauri-plugin-global-shortcut = "2.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["sync", "time", "rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }  # downloads use the system TLS
base64 = "0.23.1"
tauri-plugin-single-instance = "2.5.0"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }  # disk: free space before downloads
zip = { version = "4", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"  # downloads are checked against their published SHA-256
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Windows: taskbar right-click menu ("jump list") with "Copy last dictation".
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_UI_WindowsAndMessaging",  # window titles: is a browser on a call site?
  "Win32_System_JobObjects",  # helpers (task AI) end when Voice Desk ends, even on a crash
] }
winreg = "0.55"
keyring = { version = "3.6", features = ["windows-native"] }  # Hugging Face token in Credential Manager

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

# Linux: use the PipeWire backend, which can record what's playing on the speakers
# (meeting audio). Needs libpipewire-0.3-dev + libasound2-dev to build; the
# keyring (Secret Service) needs libdbus-1-dev.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pipewire"] }
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
