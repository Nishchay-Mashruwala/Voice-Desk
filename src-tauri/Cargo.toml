[package]
name = "voicedesk"
version = "0.1.0"
description = "Local voice dictation and meeting task extraction"
authors = ["Rajvee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voicedesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
hound = "3.5.1"
anyhow = "1.0.104"
arboard = "3.6.1"
enigo = "0.6.1"
chrono = "0.4.45"
tauri-plugin-global-shortcut = "2.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["sync", "time", "rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
base64 = "0.23.1"
tauri-plugin-single-instance = "2.5.0"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# Windows: taskbar right-click menu ("jump list") with "Copy last dictation".
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage",
] }
winreg = "0.55"

# Linux: use the PipeWire backend, which can record what's playing on the speakers
# (meeting audio). Needs libpipewire-0.3-dev + libasound2-dev to build.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pipewire"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
