name: mobile_backend
description: "Voice Desk mobile backend: recording, the database, permissions and (later) processing. Used by the app in ../frontend."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  record: ^7.1.2
  just_audio: ^0.10.6
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  flutter_foreground_task: ^11.0.3
  permission_handler: ^12.0.1
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  crypto: ^3.0.6
  archive: ^4.5.2
  sherpa_onnx: ^1.13.8
  battery_plus: ^7.1.2
  # Calls the task AI's native library (lib/engine/tasks/llm_engine.dart); was already here through sherpa_onnx.
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  just_audio_platform_interface: ^4.6.0
  sqlite3: 3.7.0

flutter:
  assets:
    # Ordinary English words: never "corrected" into vocabulary (lib/engine/speech/vocabulary.dart).
    - assets/english-words.txt
