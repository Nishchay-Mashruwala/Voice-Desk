[package]
name = "voicedesk-core"
version = "0.2.2"
description = "Voice Desk's backend: transcripts, finding tasks, the database. No desktop code."
authors = ["Rajvee"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
chrono = "0.4.45"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["sync", "time", "rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }  # downloads use the system TLS
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }  # disk: free space before downloads
zip = { version = "4", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"  # downloads are checked against their published SHA-256

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",  # helpers (task AI) end when Voice Desk ends, even on a crash
  "Win32_Security",
  "Win32_System_Threading",
] }
keyring = { version = "3.6", features = ["windows-native"] }  # Hugging Face token in Credential Manager

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

# Linux: the keyring (Secret Service) needs libdbus-1-dev.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
